server:
  port: 8088
  address: 127.0.0.1   # localhost only, not the whole LAN — /api/ingest/path can read any file on
                       # this machine the app's OS user can access, so this shouldn't be reachable
                       # from other devices on the network. Change deliberately if you need remote access.

spring:
  application:
    name: local-ai-assistant
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

assistant:
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2.5:7b     # measured warm on CPU-only: greeting 3.8s, code question 35s.
                               # llama3.2 has a higher raw token rate but is far slower in practice
                               # here - it burns extra round-trips on tool calls it shouldn't make,
                               # and leaks malformed tool-call JSON. Switch models in the header if
                               # you want to compare; no restart needed.
    temperature: 0.3
    timeout-seconds: 300

  rag:
    docs-path: ./data/docs
    code-path: ./src/main/java   # defaults to THIS project's own source — ask the assistant about its own code out of the box
    store-path: ./data/store
    chunk-size: 500
    chunk-overlap: 50
    max-results: 6     # 5 was too thin for large PDFs; 10 was accurate but too slow on CPU-only
    min-score: 0.35    # all-MiniLM scores genuinely-relevant chunks around 0.4-0.6, so 0.6 silently
                       # dropped valid matches and looked like "not in your documents"


  files:
    # Tool calls (read_file / list_files) are sandboxed to this directory - no path traversal outside it.
    allowed-root: .

  web-search:
    # Real-time web search — the ONE feature that calls out to the internet (everything else in
    # this app is fully local). Fixes the classic "LLM confidently gives an outdated/wrong answer
    # for anything after its training cutoff" problem (e.g. "what's the latest Java version?").
    # Wikipedia lookups (searchWikipedia tool) always work, no key needed. This section only gates
    # the broader live-web-search tool (searchWeb), which needs a free Tavily API key.
    enabled: false                              # set true once you have a key below
    tavily-api-key: ""                          # free key: https://app.tavily.com (1000 searches/month free)
    max-results: 5

  voice:
    enabled: true
    whisper-binary: ./tools/whisper/whisper-cli
    whisper-model: ./tools/whisper/models/ggml-small.bin   # multilingual 'small'; base.en is faster but
                                                           # markedly worse with accents and can't do Hindi
    piper-binary: ./tools/piper/piper
    piper-model: ./tools/piper/voices/en_US-lessac-medium.onnx
    language: auto     # 'auto' detects the spoken language (needed for Hindi/Hinglish).
                       # Force with e.g. 'en' or 'hi' if auto-detect guesses wrong.
    threads: 0         # 0 = auto (leaves cores free for Ollama). Raise for faster transcription.

logging:
  level:
    com.pankaj.localai: INFO
